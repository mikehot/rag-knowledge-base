server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rag_knowledge_base}
    username: ${DB_USERNAME:rag}
    password: ${DB_PASSWORD:rag}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    validate-migration-naming: true
    clean-disabled: true
    placeholders:
      # V1 creates the column with this width; V15 removes the fixed dimension, so the value is inert.
      embedding_dim: 768
      embedding_model: ${AI_EMBEDDING_MODEL_ID:text-embedding-nomic-embed-text-v1.5}
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:20MB}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:--}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,diskSpace
  metrics:
    tags:
      application: rag-knowledge-base
    distribution:
      percentiles-histogram:
        rag.ask.duration: true
        rag.ask.stage.duration: true
        rag.index.duration: true
  prometheus:
    metrics:
      export:
        enabled: true

app:
  auth:
    default-username: ${APP_DEFAULT_USERNAME:demo}
    # No built-in fallbacks: JWT_SECRET is required, and the default admin is created only when
    # APP_DEFAULT_PASSWORD is set. Local development values live in application-local.yml.
    default-password: ${APP_DEFAULT_PASSWORD:}
    jwt-secret: ${JWT_SECRET:}
    token-expires-seconds: ${JWT_EXPIRES_SECONDS:86400}
  upload:
    storage-dir: ${UPLOAD_STORAGE_DIR:./uploads}
    max-file-size-bytes: ${UPLOAD_MAX_FILE_SIZE_BYTES:20971520}
    allowed-extensions:
      - pdf
      - txt
      - md
      - docx
  rag:
    chunk-size: ${RAG_CHUNK_SIZE:700}
    chunk-overlap: ${RAG_CHUNK_OVERLAP:100}
    top-k: ${RAG_TOP_K:5}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.35}
    # 0 accepts the embedding model's own dimension; set it to pin and enforce one.
    embedding-dim: ${AI_EMBEDDING_DIM:0}
    hybrid-experiment-enabled: ${RAG_HYBRID_EXPERIMENT_ENABLED:false}
    hybrid-candidate-k: ${RAG_HYBRID_CANDIDATE_K:50}
    hybrid-keyword-weight: ${RAG_HYBRID_KEYWORD_WEIGHT:2.0}
    hybrid-rrf-k: ${RAG_HYBRID_RRF_K:60}
    context-selection-experiment-enabled: ${RAG_CONTEXT_SELECTION_EXPERIMENT_ENABLED:false}
    # OFF | REPAIR | ENFORCE: what to do when cited chunks do not support the answer (see CitationSupport).
    citation-support-mode: ${RAG_CITATION_SUPPORT_MODE:REPAIR}
  enterprise:
    default-tenant-id: 00000000-0000-0000-0000-000000000001
    default-knowledge-base-id: 00000000-0000-0000-0000-000000000101
    initialize-default-access: true
  indexing:
    enabled: ${INDEX_TASKS_ENABLED:true}
    poll-delay-ms: ${INDEX_TASK_POLL_DELAY_MS:15000}
  ai:
    provider: ${AI_PROVIDER:openai-compatible}
    base-url: ${AI_BASE_URL:http://localhost:1234/v1}
    api-key: ${AI_API_KEY:}
    model-id: ${AI_MODEL_ID:google/gemma-4-26b-a4b-qat}
    max-tokens: ${AI_MAX_TOKENS:2400}
    complex-max-tokens: ${AI_COMPLEX_MAX_TOKENS:3200}
    complex-routing-enabled: ${AI_COMPLEX_ROUTING_ENABLED:false}
    estimated-cost-per-1k-tokens: ${AI_ESTIMATED_COST_PER_1K_TOKENS:0}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:120}
    max-retries: ${AI_MAX_RETRIES:2}
    structured-output-retries: ${AI_STRUCTURED_OUTPUT_RETRIES:1}
    daily-limit: ${AI_DAILY_LIMIT:50}
    # json_schema (strict, default) or json_object for providers without json_schema support, e.g. DeepSeek.
    response-format: ${AI_RESPONSE_FORMAT:json_schema}
    # Sampling temperature sent with every chat request. Empty keeps the provider's own default, which for
    # local models is usually above 0 and makes answers vary between identical runs; 0 makes them repeatable.
    temperature: ${AI_TEMPERATURE:}
  embedding:
    provider: ${AI_EMBEDDING_PROVIDER:openai-compatible}
    base-url: ${AI_EMBEDDING_BASE_URL:${AI_BASE_URL:http://localhost:1234/v1}}
    api-key: ${AI_EMBEDDING_API_KEY:${AI_API_KEY:}}
    model-id: ${AI_EMBEDDING_MODEL_ID:text-embedding-nomic-embed-text-v1.5}
    batch-size: ${AI_EMBEDDING_BATCH_SIZE:16}
    timeout-seconds: ${AI_EMBEDDING_TIMEOUT_SECONDS:120}
    max-retries: ${AI_EMBEDDING_MAX_RETRIES:2}
